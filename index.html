<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Android Permission Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      color: white;
      background: #1967d2;
      border: 0;
      border-radius: 8px;
    }

    #log {
      margin-top: 20px;
      padding: 12px;
      background: #f1f3f4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>Chrome Android — Permission Prompt Test</h2>
  <p>
    This test observes named-tab navigation and the timing
    of a camera/microphone permission prompt.
  </p>

  <button id="start">Start Test</button>
  <div id="log">Ready.</div>

  <script>
    const log = document.getElementById("log");

    function record(message) {
      log.textContent +=
        "\n[" + new Date().toLocaleTimeString() + "] " + message;
    }

    document.getElementById("start").addEventListener("click", () => {
      log.textContent = "Test started.";

      const tab = window.open(
        "https://accounts.google.com",
        "permission-test"
      );

      if (!tab) {
        record("Chrome blocked the new tab.");
        return;
      }

      record("Opened Google in the named tab.");

      setTimeout(() => {
        record("Requesting navigation to the controlled permission page.");

        window.open(
          new URL("permission.html", location.href).href,
          "permission-test"
        );

        record("Navigation request sent. Observe the address bar and prompt.");
      }, 5000);
    });
  </script>
</body>
</html>
