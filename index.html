
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Android Named-Tab Download Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #202124;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-sizing: border-box;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 16px #00000012;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 6px;
      background: #188038;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }

    #log {
      margin-top: 20px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h2>Named-Tab Download Test</h2>

    <p>
      This test checks how Chrome for Android handles a named
      browsing context followed by a download navigation.
    </p>

    <button id="start">Start Test</button>

    <div id="log" aria-live="polite">Ready to test.</div>
  </main>

  <script>
    const log = document.getElementById("log");

    function record(message) {
      const time = new Date().toLocaleTimeString();
      log.textContent += `\n[${time}] ${message}`;
    }

    document.getElementById("start").addEventListener("click", () => {
      log.textContent = "Test started.";

      // Step 1: Open the genuine Google website.
      const tab = window.open("https://google.com", "download-test");

      if (!tab) {
        record("The browser blocked the new tab.");
        return;
      }

      record("Requested Google in named browsing context.");

      // Step 2: Wait, then navigate the same named context
      // to a controlled test download endpoint.
      setTimeout(() => {
        record("Requesting navigation to the test download.");

        window.open(
          "https://YOUR-TEST-HOST.example/test-download",
          "download-test"
        );

        record("Second navigation request issued.");
        record("Observe the tab, address bar, and download UI.");
      }, 5000);
    });
  </script>
</body>
</html>
