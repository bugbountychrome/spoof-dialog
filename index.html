<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Android Permission Navigation Test</title>
</head>
<body>
  <h2>Chrome Android Permission Test</h2>
  <p>
    Test whether a permission prompt remains visible across
    navigation. Permission requests belong to the requesting origin.
  </p>
  <button id="start">Start Test</button>
  <pre id="log">Ready.</pre>

  <script>
    const log = document.getElementById("log");

    function record(message) {
      log.textContent +=
        "\n[" + new Date().toLocaleTimeString() + "] " + message;
    }

    document.getElementById("start").addEventListener("click", () => {
      log.textContent = "Starting test...";

      const googleTab = window.open(
        "https://www.google.com/",
        "permission-test"
      );

      if (!googleTab) {
        record("Chrome blocked the Google tab.");
        return;
      }

      record("Google opened in the named tab.");
      record("Wait 5 seconds, then open the controlled permission page.");

      setTimeout(() => {
        const permissionUrl =
          new URL("permission.html", location.href).href;

        window.open(permissionUrl, "_blank");
        record("Permission page opened in a separate tab.");
        record("Observe the permission prompt and address bar.");
      }, 5000);
    });
  </script>
</body>
</html>
